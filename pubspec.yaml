name: find_cover
description: "Find Cover - Emergency Shelter Locator App"

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  url_launcher: ^6.2.5
  firebase_core: ^2.27.0
  firebase_messaging: ^14.0.0
  http: ^1.4.0
  google_maps_flutter: ^2.12.3
  shared_preferences: ^2.0.15
  path_provider: ^2.1.5
  json_annotation: ^4.8.0
  geolocator: ^14.0.1
  workmanager: ^0.6.0
  share_plus: ^11.0.0
  change_app_package_name: ^1.5.0
  permission_handler: ^11.3.1
  background_location_tracker: ^1.6.0
  flutter_map: ^8.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.6.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/SMALL LOGO.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/SMALL LOGO.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/images/SMALL LOGO.png"
    icon_size: 48
